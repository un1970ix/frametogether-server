[package]
name = "frametogether-server"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["Bedir Ekim <root@un1970ix.com>"]
description = "Sync video playback with friends!"
readme = "README.md"
repository = "https://github.com/un1970ix/frametogether-server"
license = "AGPL-3.0-or-later"
categories = ["network-programming"]
keywords = ["video", "sync", "server", "self-hosted", "watch-party"]

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "unwind"

[profile.dev]
debug = true
opt-level = 0

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "tower-log",
    "ws",
] }
dashmap = "6.1"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
governor = { version = "0.10", default-features = false, features = [
    "std",
    "dashmap",
] }
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = [
    "rt-multi-thread",
    "net",
    "time",
    "macros",
    "sync",
    "signal",
] }
tower-http = { version = "0.7", default-features = false, features = [
    "cors",
    "trace",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "std",
    "ansi",
] }
