name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --release

      - name: Verify Lockfile Is Current
        run: cargo build --locked --release

  audit:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22

      - name: Audit Dependencies
        id: audit
        continue-on-error: true
        run: cargo audit --deny warnings
      - name: Report Audit Failure
        if: failure() || steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit failed. Review the audit output.'
